# Newest commit wins. Every push to main starts this build, and builds run in
# parallel, so two merges a minute apart race: the OLDER build can finish last
# and redeploy over the newer one (it happened with #210/#212). Three things
# below stop that, and cloudbuild-backend.yaml / cloudbuild-agent.yaml copy
# them:
#
#   * The image is also tagged with $BUILD_ID and the deploy uses that tag.
#     Deploying the bare `:latest` tag meant a build could ship whichever
#     image another build had pushed most recently, not its own.
#   * Step 3 asks GitHub (`git ls-remote`, no API rate limit, the repo is
#     public) whether this build's $COMMIT_SHA is still the tip of main. If
#     not, a newer push exists, and because these triggers have no path
#     filters that push has its own build of this service, which will deploy.
#     So this build skips its deploy and still reports SUCCESS. The check sits
#     immediately before the deploy, not at the start, because the race is
#     decided by which build FINISHES last.
#   * The deploy labels the service and revision with commit-sha / gcb-build-id
#     so "what is live?" is answerable:
#       gcloud run services describe f1-frontend --region=asia-south1 \
#         --format='value(metadata.labels.commit-sha)'
#
# The check fails OPEN: a build with no COMMIT_SHA (a manual
# `gcloud builds submit`) or a GitHub hiccup deploys as before, so it can never
# be the reason a deploy silently stops. Accepted trade-off: if the newest
# commit's build fails, the commit before it is not deployed either; the fix
# is to fix main (or re-run that trigger), which deploys the tip.
steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/f1-dashboard-493015/f1-frontend'
      - '-t'
      - 'gcr.io/f1-dashboard-493015/f1-frontend:$BUILD_ID'
      - '-f'
      - 'Dockerfile.frontend'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_BASE_URL=${_NEXT_PUBLIC_API_BASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_ASSET_BASE_URL=${_NEXT_PUBLIC_ASSET_BASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_RAPIDAPI_HOST=${_NEXT_PUBLIC_RAPIDAPI_HOST}'
      - '--build-arg'
      - 'NEXT_PUBLIC_AGENT_BASE_URL=${_NEXT_PUBLIC_AGENT_BASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_GA_MEASUREMENT_ID=${_NEXT_PUBLIC_GA_MEASUREMENT_ID}'
      - '.'

  # 2. Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/f1-dashboard-493015/f1-frontend'

  # 3. Is this build still the newest commit on main? (see the header)
  #    Writes /workspace/.deploy-superseded if not; step 4 reads it.
  #    `$$` is Cloud Build's escape for a literal `$` in shell code.
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: bash
    args:
      - '-c'
      - |
        if [ -z "$COMMIT_SHA" ]; then
          echo "No COMMIT_SHA (not a trigger build): deploying without the freshness check."
          exit 0
        fi
        tip=""
        for attempt in 1 2 3; do
          tip="$$(git ls-remote https://github.com/Nisarg6502/f1-hub.git refs/heads/main | cut -f1)"
          [ -n "$$tip" ] && break
          sleep 5
        done
        if [ -z "$$tip" ]; then
          echo "WARNING: could not read main from GitHub; deploying $COMMIT_SHA anyway."
        elif [ "$$tip" = "$COMMIT_SHA" ]; then
          echo "$COMMIT_SHA is the tip of main; deploying."
        else
          echo "SUPERSEDED: main is now at $$tip, not $COMMIT_SHA. That commit's build deploys; skipping this one."
          touch /workspace/.deploy-superseded
        fi

  # 4. Deploy this build's own image to Cloud Run, unless step 3 said a newer
  #    commit exists. The wrapper only decides whether to run; everything after
  #    'gcloud' below is passed to gcloud verbatim as "$$@".
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        if [ -f /workspace/.deploy-superseded ]; then
          echo "Skipping deploy: superseded by a newer commit on main."
          exit 0
        fi
        exec gcloud "$$@"
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'f1-frontend'
      - '--image'
      - 'gcr.io/f1-dashboard-493015/f1-frontend:$BUILD_ID'
      # Merged into the existing labels (the trigger's managed-by/gcb-trigger-id
      # stay). commit-sha is empty for a manual `gcloud builds submit`.
      - '--update-labels'
      - 'commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      # `--update-env-vars`, not `--set-env-vars`: RAPIDAPI_KEY is set on the
      # service out of band and `--set-env-vars` would delete it on every
      # deploy. The same now holds for the accounts secrets below.
      #
      # BETTER_AUTH_URL is the public origin Better Auth builds callback and
      # magic-link URLs from. It is not secret, so it rides along here; on its
      # own it changes nothing, because accounts stay hidden until
      # MONGODB_URI and BETTER_AUTH_SECRET are attached (see the
      # _BETTER_AUTH_URL substitution for the one-time secret setup).
      - '--update-env-vars'
      - 'RAPIDAPI_HOST=${_NEXT_PUBLIC_RAPIDAPI_HOST},BETTER_AUTH_URL=${_BETTER_AUTH_URL}'
      - '--quiet'

images:
  - 'gcr.io/f1-dashboard-493015/f1-frontend'
  - 'gcr.io/f1-dashboard-493015/f1-frontend:$BUILD_ID'

substitutions:
  _NEXT_PUBLIC_API_BASE_URL: 'https://f1-backend-1076575666662.asia-south1.run.app'
  _NEXT_PUBLIC_ASSET_BASE_URL: 'https://storage.googleapis.com/f1-scratch-assets'
  # The RapidAPI key is no longer a build substitution at all.
  #
  # It used to be `_NEXT_PUBLIC_RAPIDAPI_KEY`, baked into the client bundle,
  # and the comment that stood here said so plainly - "not truly secret ...
  # consider proxying the call server-side". That is now done: the call goes
  # through `app/api/live-timing/route.ts`, which reads `RAPIDAPI_KEY` at
  # RUNTIME, so the key is never inlined into anything a browser downloads.
  #
  # Supply it as a Cloud Run secret once, out of band; it persists across
  # deploys because the deploy step uses `--update-env-vars`, which merges:
  #   gcloud run services update f1-frontend --region=asia-south1   #     --set-secrets=RAPIDAPI_KEY=RAPIDAPI_KEY:latest
  # Without it, /telemetry reports live timing as unconfigured, which is
  # preferable to a failed build.
  _NEXT_PUBLIC_RAPIDAPI_HOST: 'f1-live-pulse.p.rapidapi.com'
  # The f1-agent Cloud Run service (Batch 17). Baked into the client bundle at
  # build time, so the frontend must be rebuilt after the agent service is
  # first deployed — deploying the agent alone will not make the frontend see
  # it.
  _NEXT_PUBLIC_AGENT_BASE_URL: 'https://f1-agent-2w5wydk2ca-el.a.run.app'
  # GA4 measurement ID (G-XXXXXXXXXX). Empty by default and safe that way: the
  # analytics components render nothing without it, so an un-set build produces
  # the pre-analytics site rather than a broken one.
  #
  # Because it is baked in at BUILD time, creating the GA property does not
  # make a running deployment start reporting -- the frontend must be rebuilt.
  # Same gotcha as _NEXT_PUBLIC_AGENT_BASE_URL above.
  _NEXT_PUBLIC_GA_MEASUREMENT_ID: 'G-LFJ5KBBXD3'
  # Accounts (optional sign-in). The site's ONE public address. Cloud Run
  # answers on two hostnames for this service -- the project-number form below
  # and the hashed `f1-frontend-<hash>-el.a.run.app` -- and `src/proxy.ts`
  # 308-redirects every page on the other one to this one, so this value alone
  # decides which is canonical. Because the deploy step re-applies it with
  # `--update-env-vars`, change it HERE, not with a one-off `gcloud run
  # services update`, or the next deploy reverts it.
  #
  # The Google OAuth client must list this origin under "Authorized
  # JavaScript origins" (One Tap needs it) and its callback under
  # "Authorized redirect URIs", exactly:
  #   https://f1-frontend-1076575666662.asia-south1.run.app/api/auth/callback/google
  #
  # The secrets are RUNTIME values, attached to the service once, out of band,
  # and preserved by `--update-env-vars` above. Use `--update-secrets`, which
  # merges; `--set-secrets` REPLACES the service's whole secret list and would
  # drop any secret not named in that command:
  #   gcloud run services update f1-frontend --region=asia-south1 \
  #     --update-secrets=MONGODB_URI=MONGODB_URI:latest,BETTER_AUTH_SECRET=BETTER_AUTH_SECRET:latest,AGENT_USER_TOKEN_SECRET=AGENT_USER_TOKEN_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,EMAIL_SERVER_PASSWORD=EMAIL_SERVER_PASSWORD:latest
  #   gcloud run services update f1-frontend --region=asia-south1 \
  #     --update-env-vars=EMAIL_SERVER_HOST=smtp.gmail.com,EMAIL_SERVER_PORT=465,EMAIL_SERVER_USER=<address>,EMAIL_FROM='APEX <address>'
  # AUTH_TRUSTED_ORIGINS (comma-separated, --update-env-vars) can still admit
  # extra sign-in origins, but with the redirect in place nothing needs it.
  # Until MONGODB_URI and BETTER_AUTH_SECRET are attached, every account
  # surface hides itself and the site behaves exactly as it did before.
  _BETTER_AUTH_URL: 'https://f1-frontend-1076575666662.asia-south1.run.app'

options:
  logging: CLOUD_LOGGING_ONLY

