steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/f1-dashboard-493015/f1-frontend'
      - '-f'
      - 'Dockerfile.frontend'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_BASE_URL=${_NEXT_PUBLIC_API_BASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_ASSET_BASE_URL=${_NEXT_PUBLIC_ASSET_BASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_RAPIDAPI_KEY=${_NEXT_PUBLIC_RAPIDAPI_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_RAPIDAPI_HOST=${_NEXT_PUBLIC_RAPIDAPI_HOST}'
      - '--build-arg'
      - 'NEXT_PUBLIC_AGENT_BASE_URL=${_NEXT_PUBLIC_AGENT_BASE_URL}'
      - '.'

  # 2. Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/f1-dashboard-493015/f1-frontend'

  # 3. Deploy the newly pushed image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'f1-frontend'
      - '--image'
      - 'gcr.io/f1-dashboard-493015/f1-frontend'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--quiet'

images:
  - 'gcr.io/f1-dashboard-493015/f1-frontend'

substitutions:
  _NEXT_PUBLIC_API_BASE_URL: 'https://f1-backend-1076575666662.asia-south1.run.app'
  _NEXT_PUBLIC_ASSET_BASE_URL: 'https://storage.googleapis.com/f1-scratch-assets'
  # The RapidAPI key is kept out of the repo. Provide it at build time:
  #   gcloud builds submit --config=cloudbuild-frontend.yaml \
  #     --substitutions=_NEXT_PUBLIC_RAPIDAPI_KEY=<key>
  # Left empty by default; without it the /telemetry live-timing feature is
  # simply unavailable, which is preferable to a failed build. (Note this value
  # is baked into the client bundle, so it is not truly secret — rotate the key
  # if it leaks and consider proxying the call server-side.)
  _NEXT_PUBLIC_RAPIDAPI_KEY: ''
  _NEXT_PUBLIC_RAPIDAPI_HOST: 'f1-live-pulse.p.rapidapi.com'
  # The f1-agent Cloud Run service (Batch 17). Baked into the client bundle at
  # build time, so the frontend must be rebuilt after the agent service is
  # first deployed — deploying the agent alone will not make the frontend see
  # it.
  _NEXT_PUBLIC_AGENT_BASE_URL: 'https://f1-agent-2w5wydk2ca-el.a.run.app'

options:
  logging: CLOUD_LOGGING_ONLY

