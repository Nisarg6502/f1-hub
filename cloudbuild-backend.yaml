steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/f1-dashboard-493015/f1-backend'
      - '-t'
      - 'gcr.io/f1-dashboard-493015/f1-backend:$BUILD_ID'
      - '-f'
      - 'Dockerfile.backend'
      - '.'

  # 2. Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/f1-dashboard-493015/f1-backend'

  # 3. Is this build still the newest commit on main? (see the header of
  #    cloudbuild-frontend.yaml, which explains the race and this fix)
  #    Writes /workspace/.deploy-superseded if not; step 4 reads it.
  #    `$$` is Cloud Build's escape for a literal `$` in shell code.
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: bash
    args:
      - '-c'
      - |
        if [ -z "$COMMIT_SHA" ]; then
          echo "No COMMIT_SHA (not a trigger build): deploying without the freshness check."
          exit 0
        fi
        tip=""
        for attempt in 1 2 3; do
          tip="$$(git ls-remote https://github.com/Nisarg6502/f1-hub.git refs/heads/main | cut -f1)"
          [ -n "$$tip" ] && break
          sleep 5
        done
        if [ -z "$$tip" ]; then
          echo "WARNING: could not read main from GitHub; deploying $COMMIT_SHA anyway."
        elif [ "$$tip" = "$COMMIT_SHA" ]; then
          echo "$COMMIT_SHA is the tip of main; deploying."
        else
          echo "SUPERSEDED: main is now at $$tip, not $COMMIT_SHA. That commit's build deploys; skipping this one."
          touch /workspace/.deploy-superseded
        fi

  # 4. Deploy this build's own image to Cloud Run, unless step 3 said a newer
  #    commit exists. The wrapper only decides whether to run; everything after
  #    'gcloud' below is passed to gcloud verbatim as "$$@".
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        if [ -f /workspace/.deploy-superseded ]; then
          echo "Skipping deploy: superseded by a newer commit on main."
          exit 0
        fi
        exec gcloud "$$@"
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'f1-backend'
      - '--image'
      - 'gcr.io/f1-dashboard-493015/f1-backend:$BUILD_ID'
      # Merged into the existing labels. commit-sha is empty for a manual
      # `gcloud builds submit`.
      - '--update-labels'
      - 'commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      # `--update-env-vars`, NOT `--set-env-vars`. This service's other
      # variables (MONGODB_URI among them) were set directly on the service and
      # do not appear in this file; `--set-env-vars` REPLACES the whole
      # environment and would delete every one of them on the next deploy.
      # `--update-env-vars` merges.
      - '--update-env-vars'
      - '^;^API_ALLOWED_ORIGINS=${_API_ALLOWED_ORIGINS}'
      # The data API has no rate limiter of its own, so instance count is the
      # only ceiling on what a burst of traffic can cost. The agent already
      # pins itself to 1 for the same reason.
      - '--max-instances'
      - '2'
      - '--quiet'

  # 5. Rebuild watch mode's caches for the season's finished rounds.
  #    `race_replay` and `race_timing` are keyed by a fingerprint of the code
  #    that builds them, so a deploy touching that code retires every cached
  #    round at once, and each round's next viewer paid for the rebuild inside
  #    their page load (21s on 2026-11-08). Never fails the build: a cold
  #    cache is a slow page, not a broken deploy.
  #    Runs on a plain Python image: the cloud-sdk image has no `python3`
  #    (the first run, for #232, died on `python3: command not found`). The
  #    script is stdlib only, so nothing needs installing.
  - name: 'python:3.12-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        if [ -f /workspace/.deploy-superseded ]; then
          echo "Skipping cache warm: this build did not deploy."
          exit 0
        fi
        python3 backend/app/watch_cache_warm.py --base "${_BACKEND_URL}" || true

substitutions:
  # Both Cloud Run URLs the frontend is served from, matching
  # `_AGENT_ALLOWED_ORIGINS` in cloudbuild-agent.yaml. The delimiter is
  # overridden to `;` above because this value contains commas, which gcloud
  # would otherwise read as separators between variables.
  _API_ALLOWED_ORIGINS: 'https://f1-frontend-1076575666662.asia-south1.run.app,https://f1-frontend-2w5wydk2ca-el.a.run.app'
  # The service this build deploys, for the cache warm in step 5.
  _BACKEND_URL: 'https://f1-backend-1076575666662.asia-south1.run.app'

images:
  - 'gcr.io/f1-dashboard-493015/f1-backend'
  - 'gcr.io/f1-dashboard-493015/f1-backend:$BUILD_ID'

# Default is 600s. A cold warm (step 5) after a full image build can pass it:
# each rebuilt round can take up to ~15s against OpenF1, sequentially.
timeout: '1200s'

options:
  logging: CLOUD_LOGGING_ONLY

